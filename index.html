
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusEvents</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <header>
    <h1>CampusEvents</h1>
